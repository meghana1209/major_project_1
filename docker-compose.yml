version: '3.8'
services:
  mongo:
    image: mongo:6.0
    container_name: walmart-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: walmart_clone

  mongo-express:
    image: mongo-express:1.0.0
    container_name: walmart-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ''
      ME_CONFIG_MONGODB_ADMINPASSWORD: ''
      ME_CONFIG_MONGODB_SERVER: mongo

volumes:
  mongo-data:
    name: walmart_mongo_data
